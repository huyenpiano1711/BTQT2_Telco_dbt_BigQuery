version: 2

models:
  - name: customers_cleaned
    description: >
      Cleaned Silver customer dataset. Standardizes service categories and
      boolean fields, imputes TotalCharges for new customers, and flags
      potentially material charge differences for review.
    columns:
      - name: customer_id
        description: Unique customer identifier.
        data_tests:
          - unique
          - not_null
      - name: gender
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Female', 'Male']
      - name: senior_citizen
        data_tests:
          - not_null
      - name: partner
        data_tests:
          - not_null
      - name: dependents
        data_tests:
          - not_null
      - name: tenure
        data_tests:
          - not_null
      - name: phone_service
        data_tests:
          - not_null
      - name: internet_service
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['DSL', 'Fiber optic', 'No']
      - name: multiple_lines
        description: Đã chuẩn hóa 'No phone service' / 'No internet service' về 'No'.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Yes', 'No']
      - name: online_security
        description: Đã chuẩn hóa 'No phone service' / 'No internet service' về 'No'.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Yes', 'No']
      - name: online_backup
        description: Đã chuẩn hóa 'No phone service' / 'No internet service' về 'No'.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Yes', 'No']
      - name: device_protection
        description: Đã chuẩn hóa 'No phone service' / 'No internet service' về 'No'.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Yes', 'No']
      - name: tech_support
        description: Đã chuẩn hóa 'No phone service' / 'No internet service' về 'No'.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Yes', 'No']
      - name: streaming_tv
        description: Đã chuẩn hóa 'No phone service' / 'No internet service' về 'No'.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Yes', 'No']
      - name: streaming_movies
        description: Đã chuẩn hóa 'No phone service' / 'No internet service' về 'No'.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Yes', 'No']
      - name: contract
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Month-to-month', 'One year', 'Two year']
      - name: paperless_billing
        data_tests:
          - not_null
      - name: payment_method
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 'Bank transfer (automatic)'
                  - 'Credit card (automatic)'
                  - 'Electronic check'
                  - 'Mailed check'
      - name: monthly_charges
        data_tests:
          - not_null
      - name: total_charges
        data_tests:
          - not_null
      - name: churn
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: is_total_charges_imputed
        data_tests:
          - not_null
      - name: is_charge_variance
        data_tests:
          - not_null
